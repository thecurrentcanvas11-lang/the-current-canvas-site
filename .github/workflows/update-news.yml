# Runs online every ~5 minutes: rebuilds the data briefs, writes a new original article (Claude API),
# and deploys the site to GitHub Pages. Only new articles / photos / writer state are committed, so the
# repository history stays small.
#
# One-time setup (see the chat for the exact steps):
#   1. Repo > Settings > Secrets and variables > Actions > New secret:  ANTHROPIC_API_KEY
#   2. Repo > Settings > Pages > Build and deployment > Source: "GitHub Actions"
name: Update and deploy site

on:
  schedule:
    - cron: '*/5 * * * *'     # GitHub may delay scheduled runs by a few minutes at busy times
  workflow_dispatch:
    inputs:
      count:
        description: 'How many articles to write in this run (the 60-per-day cap still applies)'
        default: '1'
      today:
        description: 'Cover every story since midnight Pakistan time, newest first'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['generated.js', 'images/g-*', 'scripts/writer-state.json']

concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild data briefs (news.json / news.js)
        shell: pwsh
        run: ./scripts/fetch-news.ps1

      - name: Write original articles
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 90
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COUNT: ${{ github.event.inputs.count }}
          TODAY: ${{ github.event.inputs.today }}
        run: |
          $n = 1; [int]::TryParse("$env:COUNT", [ref]$n) | Out-Null; if ($n -lt 1) { $n = 1 }
          $extra = @(); if ($env:TODAY -eq 'true') { $extra = @('-Today') }
          for ($k = 1; $k -le $n; $k++) {
            Write-Host "=== article $k of up to $n ==="
            ./scripts/write-articles.ps1 @extra
            if ($LASTEXITCODE -ne 0) { Write-Host 'stopping: writer error'; break }
            $last = Get-Content scripts/writer.log -Tail 1
            if ($last -match 'no fresh candidates|daily cap reached|all candidates already covered|no API key') { Write-Host "stopping: $last"; break }
          }

      - name: Commit new article, photo and writer state (only if changed)
        run: |
          git config user.name "canvas-bot"
          git config user.email "canvas-bot@users.noreply.github.com"
          git add generated.js images scripts/writer-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish new original article"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html styles.css app.js pages.js originals.js generated.js _site/
          cp -f news.js news.json _site/ 2>/dev/null || true   # missing only if every data source failed this run
          cp -r brand images _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
